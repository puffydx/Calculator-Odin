<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Calculator</title>
    <script src="calc.js" defer> </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container"> 
    <div id="display" style="padding-bottom: 16px;"> 0 </div>

    <div id="numbers"> 
    <button>0</button>
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    </div>

    <div id="operators" style="padding-top: 16px;"> 
    <button>+</button>
    <button>-</button>
    <button>/</button>
    <button>*</button>
    <button>=</button>
    </div>

    <div id="misc">
        <button> Clear </button>
    </div>
</div>
</body>
</html>
